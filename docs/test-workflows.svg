<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>Raw test and harness test on VerilogEval</title>
<desc>Two flows side by side. Raw: spec, one model request, extract code, hidden judge. Harness: spec, agent writes design, compile and checks, final compile, hidden judge. Both results feed one comparison table.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="600" fill="#ffffff"/>
<g font-size="14" font-weight="500" fill="#0f0f0f" text-anchor="middle" dominant-baseline="central">
<text x="170" y="46">Raw test</text>
<text x="510" y="46">Harness test</text>
</g>
<g stroke-width="0.75">
<rect x="50" y="70" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="50" y="154" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="50" y="238" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="50" y="406" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="390" y="70" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="390" y="154" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="390" y="238" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="390" y="322" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56"/>
<rect x="390" y="406" width="240" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="220" y="500" width="240" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/>
<rect x="50" y="566" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="170" y="566" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
</g>
<g font-size="14" font-weight="500" text-anchor="middle" dominant-baseline="central">
<text x="170" y="88" fill="#444441">Problem spec</text>
<text x="170" y="172" fill="#3C3489">One model request</text>
<text x="170" y="256" fill="#444441">Extract the code</text>
<text x="170" y="424" fill="#444441">Hidden judge</text>
<text x="510" y="88" fill="#444441">Problem spec</text>
<text x="510" y="172" fill="#3C3489">Agent writes the design</text>
<text x="510" y="256" fill="#085041">Compile and checks</text>
<text x="510" y="340" fill="#085041">Final compile by harness</text>
<text x="510" y="424" fill="#444441">Hidden judge</text>
<text x="340" y="522" fill="#444441">Comparison table</text>
</g>
<g font-size="12" text-anchor="middle" dominant-baseline="central">
<text x="170" y="106" fill="#5F5E5A">Benchmark prompt text</text>
<text x="170" y="190" fill="#534AB7">No tools, no feedback</text>
<text x="170" y="274" fill="#5F5E5A">From the reply text</text>
<text x="170" y="442" fill="#5F5E5A">Benchmark test and reference</text>
<text x="510" y="106" fill="#5F5E5A">Saved as spec.md</text>
<text x="510" y="190" fill="#534AB7">Rules and skills loaded</text>
<text x="510" y="274" fill="#0F6E56">Errors and hints go back</text>
<text x="510" y="358" fill="#0F6E56">Before the run may end</text>
<text x="510" y="442" fill="#5F5E5A">Same test, same flags</text>
</g>
<g font-size="12" fill="#5F5E5A" dominant-baseline="central">
<text x="72" y="573">Model step</text>
<text x="192" y="573">Harness check, no model</text>
</g>
<g fill="none" stroke="#5F5E5A" stroke-width="1.5">
<line x1="170" y1="126" x2="170" y2="150" marker-end="url(#arrow)"/>
<line x1="170" y1="210" x2="170" y2="234" marker-end="url(#arrow)"/>
<line x1="170" y1="294" x2="170" y2="402" marker-end="url(#arrow)"/>
